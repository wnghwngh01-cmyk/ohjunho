<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17201c">
  <meta name="description" content="하루를 담다 비밀번호 재설정">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src 'self' https://kplhezgrxuiuswsbhpdw.supabase.co wss://kplhezgrxuiuswsbhpdw.supabase.co; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>비밀번호 재설정 · 하루를 담다</title>
  <link rel="stylesheet" href="./assets/styles.css?v=20260919-password-recovery-v1">
</head>
<body>
  <main class="auth-shell reset-shell">
    <section class="auth-panel">
      <div class="auth-card" aria-labelledby="resetTitle">
        <div><small class="muted">HARU ACCOUNT</small><h2 id="resetTitle">새 비밀번호 설정</h2></div>
        <p>메일에서 받은 재설정 링크로 들어오면 새 비밀번호를 설정할 수 있습니다.</p>
        <form id="resetPasswordForm" class="stack" novalidate>
          <label class="field"><span>새 비밀번호</span><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="8자 이상" disabled></label>
          <label class="field"><span>새 비밀번호 확인</span><input id="newPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required placeholder="비밀번호를 한 번 더 입력" disabled></label>
          <button id="resetPasswordSubmit" class="btn primary" type="submit" disabled>비밀번호 변경</button>
        </form>
        <div id="resetPasswordMessage" class="auth-message" aria-live="polite">재설정 링크를 확인하고 있습니다…</div>
        <p><a class="link-btn" href="./index.html">로그인 화면으로 돌아가기</a></p>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
  <script src="./js/config.js?v=20260918-community-inserts-v1"></script>
  <script src="./js/reset-password.js?v=20260919-password-recovery-v1"></script>
</body>
</html>
