<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>운영실 · 하루를 담다</title><link rel="stylesheet" href="./assets/admin.css?v=20261009-operator-v4"></head>
<body><div class="shell"><aside><a class="brand" href="./admin.html">하루를 담다 <span>운영실</span></a><nav id="nav" aria-label="운영 메뉴"></nav><p class="aside-note">작은 불편을 살피고<br>안전한 하루를 지킵니다.</p><a class="recovery-link" href="./admin-recovery.html" target="_blank" rel="noopener">인증 앱 분실·복구 안내</a><button id="logout" hidden>로그아웃</button></aside><main>
<header><div><p class="eyebrow">HARU / OPERATIONS</p><h1 id="heading">운영자 로그인</h1><p id="description">등록된 운영자 계정과 2단계 인증으로 접속하세요.</p></div><span class="badge">운영자 전용</span></header>
<p id="notice" role="status" aria-live="polite"></p>
<section id="auth" class="panel narrow"><form id="loginForm"><h2>다시 만나 반갑습니다</h2><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">로그인</button></form><form id="mfaForm" hidden><h2>2단계 인증</h2><p id="mfaHelp">인증 앱의 6자리 숫자를 입력하세요.</p><div id="qr"></div><label>인증번호<input id="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button class="primary" type="submit">인증하고 운영실 열기</button></form></section>
<section id="workspace" hidden><form id="filters" class="toolbar"><label class="grow">검색<input id="search" type="search" placeholder="이름, 사용자 ID 또는 내용"></label><label>처리 상태<select id="status"><option value="">전체</option><option value="open">접수</option><option value="reviewing">확인 중</option><option value="planned">수정 예정</option><option value="resolved">해결</option><option value="dismissed">종결</option></select></label><button type="submit">조회</button><button id="refresh" type="button">새로고침</button></form><div id="content"></div><div class="pager"><button id="prev">이전</button><span id="page"></span><button id="next">다음</button></div></section>
</main></div><button id="moreMenu" class="operator-more" aria-haspopup="dialog" aria-controls="menuDialog" hidden>☰ 더보기</button><dialog id="menuDialog" aria-labelledby="menuTitle"><div class="dialog-head"><h2 id="menuTitle">운영 메뉴</h2><button id="closeMenu" aria-label="운영 메뉴 닫기">닫기</button></div><nav id="moreNav" aria-label="전체 운영 메뉴"></nav></dialog><dialog id="detail"><div class="dialog-head"><h2 id="detailTitle">상세 보기</h2><button id="closeDetail" aria-label="상세 닫기">닫기</button></div><p id="dialogNotice" role="alert"></p><div id="detailBody"></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script><script src="./js/config.js"></script><script src="./js/admin-data.js?v=20261009-operator-v4"></script><script src="./js/admin.js?v=20261009-operator-v4"></script></body></html>
